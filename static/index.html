<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Free Fire Packet Capture</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0e1a;
            color: #c8d6e5;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #111a2e, #0d1225);
            border: 1px solid #1e2d4a;
            border-radius: 16px;
            padding: 24px 30px;
            margin-bottom: 24px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(90deg, #00d4ff, #7b2ffc, #00d4ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .header .subtitle {
            color: #667a9a;
            font-size: 14px;
            margin-top: 4px;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
            animation: pulse 1.5s ease-in-out infinite;
            margin-right: 8px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.8); }
        }
        
        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 18px;
        }
        .stat-card {
            background: #111a2e;
            border: 1px solid #1e2d4a;
            border-radius: 10px;
            padding: 12px 16px;
            text-align: center;
            transition: 0.3s;
        }
        .stat-card:hover { border-color: #00d4ff; }
        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-card .label {
            font-size: 11px;
            color: #667a9a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }
        
        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .controls input, .controls select {
            background: #111a2e;
            border: 1px solid #1e2d4a;
            color: #c8d6e5;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            flex: 1;
            min-width: 150px;
            transition: 0.3s;
        }
        .controls input:focus, .controls select:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.05);
        }
        .controls input::placeholder { color: #3a4a5a; }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary {
            background: linear-gradient(90deg, #00d4ff, #7b2ffc);
            color: #fff;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0, 212, 255, 0.2); }
        .btn-danger {
            background: linear-gradient(90deg, #ff0040, #ff0066);
            color: #fff;
        }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255, 0, 64, 0.2); }
        .btn-outline {
            background: transparent;
            border: 1px solid #1e2d4a;
            color: #c8d6e5;
        }
        .btn-outline:hover { background: #1a253f; }
        
        /* Packets */
        .packet {
            background: #111a2e;
            border: 1px solid #1e2d4a;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 6px;
            transition: 0.3s;
            cursor: pointer;
        }
        .packet:hover {
            border-color: #00d4ff;
            transform: translateX(4px);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.05);
        }
        .packet-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .packet-time {
            font-size: 11px;
            color: #3a4a5a;
            font-weight: 600;
            min-width: 150px;
        }
        .packet-method {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .method-GET { background: #0a2a1a; color: #4ae0a0; }
        .method-POST { background: #0a1a2a; color: #4ac0e0; }
        .method-PUT { background: #2a2a0a; color: #e0c040; }
        .method-DELETE { background: #2a0a0a; color: #e04040; }
        .method-UNKNOWN { background: #1a1a1a; color: #666; }
        
        .packet-url {
            font-size: 13px;
            word-break: break-all;
            flex: 1;
            min-width: 150px;
            color: #8ab0d0;
        }
        
        .badges { display: flex; flex-wrap: wrap; gap: 4px; }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .badge-jwt { background: #0a2a1a; color: #60d080; }
        .badge-gacha { background: #2a0a1a; color: #e06080; }
        .badge-switch { background: #0a1a2a; color: #60b0e0; }
        .badge-login { background: #1a0a2a; color: #b080d0; }
        .badge-auth { background: #2a1a0a; color: #e0b060; }
        .badge-item { background: #2a2a0a; color: #e0c060; }
        .badge-unknown { background: #1a1a1a; color: #666; }
        
        .packet-details {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #1a253f;
            font-size: 12px;
        }
        .packet-details.open { display: block; }
        
        .detail-row {
            display: flex;
            padding: 4px 0;
            gap: 8px;
        }
        .detail-row .key {
            color: #667a9a;
            min-width: 80px;
            font-weight: 600;
        }
        .detail-row .value {
            word-break: break-all;
            color: #c8d6e5;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            background: #0a0e1a;
            padding: 4px 8px;
            border-radius: 4px;
            flex: 1;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .item-ids { color: #e0c060; font-weight: bold; }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #3a4a5a;
        }
        .empty-state .icon { font-size: 64px; margin-bottom: 16px; }
        .empty-state h2 { font-size: 22px; color: #667a9a; margin-bottom: 8px; }
        .empty-state p { font-size: 14px; max-width: 400px; margin: 0 auto; line-height: 1.6; }
        
        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #111a2e;
            border: 1px solid #1e2d4a;
            border-radius: 16px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a253f;
        }
        .modal-header h2 { font-size: 20px; }
        .modal-close {
            background: none;
            border: none;
            color: #667a9a;
            font-size: 28px;
            cursor: pointer;
            padding: 0 8px;
            transition: 0.3s;
        }
        .modal-close:hover { color: #fff; transform: rotate(90deg); }
        .modal-body .field {
            margin: 8px 0;
            padding: 6px 0;
        }
        .modal-body .field .label {
            color: #667a9a;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .modal-body .field .content {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: #0a0e1a;
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 4px;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .modal-body .field .content .hl { color: #00d4ff; }
        .modal-body .field .content .hl-purple { color: #7b2ffc; }
        .modal-body .field .content .hl-green { color: #60d080; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0a0e1a; }
        ::-webkit-scrollbar-thumb { background: #1e2d4a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #2a3a5a; }
        
        @media (max-width: 600px) {
            .header { padding: 16px 20px; }
            .header h1 { font-size: 20px; }
            .stats { grid-template-columns: repeat(3, 1fr); }
            .stat-card .number { font-size: 20px; }
            .packet { padding: 10px 14px; }
            .packet-time { min-width: 100px; }
            .controls { flex-direction: column; }
            .controls input, .controls select { min-width: auto; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="header-top">
            <div>
                <h1>🔥 Free Fire Packet Capture</h1>
                <div class="subtitle">Real-time network traffic analyzer</div>
            </div>
            <div style="display:flex;align-items:center;color:#667a9a;font-size:14px;">
                <span class="status-dot"></span>
                <span id="statusText">Live</span>
                <span style="margin:0 8px;">|</span>
                <span>Server: clientbp.ggpolarbear.com</span>
            </div>
        </div>
        <div class="stats">
            <div class="stat-card"><div class="number" id="statTotal">0</div><div class="label">Total Packets</div></div>
            <div class="stat-card"><div class="number" id="statGacha">0</div><div class="label">🎰 Gacha</div></div>
            <div class="stat-card"><div class="number" id="statJWT">0</div><div class="label">🔑 JWT</div></div>
            <div class="stat-card"><div class="number" id="statLogin">0</div><div class="label">🔐 Login</div></div>
            <div class="stat-card"><div class="number" id="statItems">0</div><div class="label">💎 Items</div></div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <input type="text" id="searchInput" placeholder="🔍 Search URL, UID, Token, Item ID..." oninput="filterPackets()">
        <select id="methodFilter" onchange="filterPackets()">
            <option value="">All Methods</option>
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
        </select>
        <select id="typeFilter" onchange="filterPackets()">
            <option value="">All Types</option>
            <option value="gacha">🎰 Gacha</option>
            <option value="switch">🔄 Switch</option>
            <option value="login">🔐 Login</option>
            <option value="jwt">🔑 JWT</option>
            <option value="item">💎 Item</option>
        </select>
        <button class="btn btn-primary" onclick="refreshData()">🔄 Refresh</button>
        <button class="btn btn-danger" onclick="clearData()">🗑️ Clear</button>
        <div style="display:flex;align-items:center;gap:8px;color:#3a4a5a;font-size:13px;margin-left:auto;">
            <span>Auto</span>
            <input type="checkbox" id="autoRefresh" checked onchange="toggleAutoRefresh()" style="accent-color:#00d4ff;width:18px;height:18px;">
        </div>
    </div>

    <!-- Packets -->
    <div id="packetsContainer">
        <div class="empty-state">
            <div class="icon">📡</div>
            <h2>Waiting for packets...</h2>
            <p>Open Free Fire and start playing. All requests will appear here in real-time.</p>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modalTitle">📦 Packet Details</h2>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body" id="modalContent"></div>
    </div>
</div>

<script>
    let allPackets = [];
    let autoRefreshInterval = null;

    async function fetchData() {
        try {
            const response = await fetch('/api/captured');
            if (response.ok) {
                const data = await response.json();
                allPackets = data.data || [];
                updateUI();
                updateStats();
            }
        } catch (e) {
            console.error('Fetch error:', e);
        }
    }

    function updateStats() {
        const total = allPackets.length;
        const gacha = allPackets.filter(p => p.is_gacha).length;
        const jwt = allPackets.filter(p => p.has_jwt).length;
        const login = allPackets.filter(p => p.is_login).length;
        const items = allPackets.filter(p => p.item_ids && p.item_ids.length > 0).length;

        document.getElementById('statTotal').textContent = total;
        document.getElementById('statGacha').textContent = gacha;
        document.getElementById('statJWT').textContent = jwt;
        document.getElementById('statLogin').textContent = login;
        document.getElementById('statItems').textContent = items;
    }

    function filterPackets() {
        updateUI();
    }

    function getFilteredPackets() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const method = document.getElementById('methodFilter').value;
        const type = document.getElementById('typeFilter').value;

        return allPackets.filter(p => {
            const url = (p.url || '').toLowerCase();
            const uid = String(p.uid || '').toLowerCase();
            const token = (p.token || '').toLowerCase();
            const items = (p.item_ids || []).join(' ').toLowerCase();
            
            const methodMatch = !method || p.method === method;
            const typeMatch = !type || 
                (type === 'gacha' && p.is_gacha) ||
                (type === 'switch' && p.is_switch) ||
                (type === 'login' && p.is_login) ||
                (type === 'jwt' && p.has_jwt) ||
                (type === 'item' && p.item_ids && p.item_ids.length > 0);
            const searchMatch = !search || 
                url.includes(search) || 
                uid.includes(search) || 
                token.includes(search) ||
                items.includes(search);

            return methodMatch && typeMatch && searchMatch;
        });
    }

    function updateUI() {
        const container = document.getElementById('packetsContainer');
        const filtered = getFilteredPackets();

        if (allPackets.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📡</div>
                    <h2>Waiting for packets...</h2>
                    <p>Open Free Fire and start playing. All requests will appear here in real-time.</p>
                </div>
            `;
            return;
        }

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">🔍</div>
                    <h2>No matching packets</h2>
                    <p>Try adjusting your search filters.</p>
                </div>
            `;
            return;
        }

        let html = '';
        filtered.slice().reverse().forEach((p) => {
            const time = p.timestamp ? new Date(p.timestamp).toLocaleString() : '';
            const method = p.method || 'UNKNOWN';
            const url = p.url || '';
            
            let badges = '';
            if (p.has_jwt) badges += `<span class="badge badge-jwt">🔑 JWT</span>`;
            if (p.is_gacha) badges += `<span class="badge badge-gacha">🎰 Gacha</span>`;
            if (p.is_switch) badges += `<span class="badge badge-switch">🔄 Switch</span>`;
            if (p.is_login) badges += `<span class="badge badge-login">🔐 Login</span>`;
            if (p.is_auth) badges += `<span class="badge badge-auth">🔒 Auth</span>`;
            if (p.item_ids && p.item_ids.length > 0) {
                badges += `<span class="badge badge-item">💎 ${p.item_ids.join(', ')}</span>`;
            }

            let detailsHtml = '';
            if (p.token) {
                detailsHtml += `<div class="detail-row"><span class="key">🔑 Token:</span><span class="value">${p.token}</span></div>`;
            }
            if (p.body_hex) {
                detailsHtml += `<div class="detail-row"><span class="key">📦 Body:</span><span class="value">${p.body_hex.substring(0, 200)}${p.body_hex.length > 200 ? '...' : ''}</span></div>`;
            }
            if (p.item_ids && p.item_ids.length > 0) {
                detailsHtml += `<div class="detail-row"><span class="key">💎 Items:</span><span class="value"><span class="item-ids">${p.item_ids.join(', ')}</span></span></div>`;
            }
            if (p.uid) {
                detailsHtml += `<div class="detail-row"><span class="key">👤 UID:</span><span class="value">${p.uid}</span></div>`;
            }
            if (p.error) {
                detailsHtml += `<div class="detail-row"><span class="key">❌ Error:</span><span class="value" style="color:#e06080;">${p.error}</span></div>`;
            }

            html += `
                <div class="packet" onclick="showModal(${allPackets.indexOf(p)})">
                    <div class="packet-header">
                        <span class="packet-time">${time}</span>
                        <span class="packet-method method-${method}">${method}</span>
                        <span class="packet-url">${url}</span>
                        <div class="badges">${badges}</div>
                    </div>
                    <div class="packet-details" id="details-${allPackets.indexOf(p)}">${detailsHtml}</div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function showModal(index) {
        const p = allPackets[index];
        if (!p) return;

        const modal = document.getElementById('modalOverlay');
        const content = document.getElementById('modalContent');
        
        let html = '';
        html += `<div class="field"><div class="label">🕐 Timestamp</div><div class="content">${p.timestamp || 'N/A'}</div></div>`;
        html += `<div class="field"><div class="label">📡 Request</div><div class="content">${p.method || 'UNKNOWN'} ${p.url || 'N/A'}</div></div>`;
        if (p.uid) html += `<div class="field"><div class="label">👤 UID</div><div class="content">${p.uid}</div></div>`;
        if (p.token) html += `<div class="field"><div class="label">🔑 JWT Token</div><div class="content" style="font-size:11px;word-break:break-all;">${p.token}</div></div>`;
        if (p.body_hex) html += `<div class="field"><div class="label">📦 Body (Hex)</div><div class="content" style="font-size:11px;">${p.body_hex}</div></div>`;
        if (p.body_text) html += `<div class="field"><div class="label">📝 Body (Text)</div><div class="content" style="font-size:12px;">${p.body_text}</div></div>`;
        if (p.response_hex) html += `<div class="field"><div class="label">📥 Response</div><div class="content" style="font-size:11px;">${p.response_hex}</div></div>`;
        if (p.item_ids && p.item_ids.length > 0) {
            html += `<div class="field"><div class="label">💎 Item IDs</div><div class="content" style="color:#e0c060;">${p.item_ids.join(', ')}</div></div>`;
        }
        if (p.error) html += `<div class="field"><div class="label">❌ Error</div><div class="content" style="color:#e06080;">${p.error}</div></div>`;

        content.innerHTML = html;
        document.getElementById('modalTitle').textContent = `📦 Packet #${allPackets.length - index}`;
        modal.classList.add('active');
    }

    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('active');
    }

    async function refreshData() {
        await fetchData();
    }

    async function clearData() {
        if (confirm('🗑️ Clear all captured packets?')) {
            try {
                await fetch('/api/clear', { method: 'POST' });
                allPackets = [];
                updateUI();
                updateStats();
            } catch (e) {
                console.error('Clear error:', e);
            }
        }
    }

    function toggleAutoRefresh() {
        const checked = document.getElementById('autoRefresh').checked;
        if (checked) {
            autoRefreshInterval = setInterval(fetchData, 3000);
        } else {
            clearInterval(autoRefreshInterval);
        }
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
        if (e.key === 'r' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            refreshData();
        }
    });

    // Initial load
    fetchData();
    autoRefreshInterval = setInterval(fetchData, 3000);
</script>
</body>
</html>
